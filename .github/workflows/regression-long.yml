name: regression-long

# The 24 h Hadimkoy simulation takes too long to run on every commit.
# It runs once a week, on every published release, and on request.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'   # every Monday at 03:17 UTC
  release:
    types: [ published ]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Regression test (Hadimkoy 24 h)
        run: ctest --test-dir build -C Release -L long --output-on-failure

      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results-long
          path: build/regression_results/*.csv
          if-no-files-found: ignore
