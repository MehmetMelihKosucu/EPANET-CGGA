name: build-and-test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests
        run: ctest --test-dir build -C Release -L unit --output-on-failure

      - name: Regression tests (Onizuka and Nault and Karney networks)
        run: ctest --test-dir build -C Release -L regression -LE long --output-on-failure

      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: build/regression_results/*.csv
          if-no-files-found: ignore
