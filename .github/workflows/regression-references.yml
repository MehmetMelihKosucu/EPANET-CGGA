name: regression-references

# Regenerates the reference files in tests/regression/reference/ with the
# same Windows build that the CI uses, and uploads them as an artifact.
# Run it manually from the Actions tab after an intended change in results,
# then commit the downloaded files.

on:
  workflow_dispatch:
  push:
    branches: [ regression-tests ]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Regenerate reference files
        run: cmake --build build --config Release --target regression_update

      - name: Upload reference files
        uses: actions/upload-artifact@v4
        with:
          name: regression-references
          path: tests/regression/reference/*.csv
          if-no-files-found: error

      # Bootstrap only: commit the first set of reference files to the branch.
      - name: Commit reference files (bootstrap)
        if: github.event_name == 'push' && github.ref == 'refs/heads/regression-tests'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/regression/reference/*.csv
          if git diff --cached --quiet; then
            echo "Reference files unchanged."
          else
            git commit -m "Update regression reference files (windows-latest, MSVC, x64, Release)"
            git push
          fi
